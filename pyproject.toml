[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-agent"
version = "0.1.0"
description = "AI-Driven Incident Response Agent"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "python-dotenv",
    "groq",
    "requests"
]

[project.scripts]
argus = "argus.cli:app"

[tool.setuptools.packages.find]
include = ["argus*"]